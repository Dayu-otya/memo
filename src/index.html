<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<!-- CSP は src-tauri/tauri.conf.json の app.security.csp に集約した(Tauri の呼び出しを通すため connect-src に ipc: を許可)。 -->
<title>メモ帳</title>
<link rel="stylesheet" href="style.css" />

</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="sidebar-top">
        <div class="sidebar-header">
          <h1>メモ帳</h1>
          <div class="header-btns">
            <button id="themeToggleBtn" class="icon-btn ghost" aria-label="ダークモード切り替え" title="ダークモード切り替え">◐</button>
            <button id="todoBtn" class="icon-btn ghost" aria-label="Todo一覧" title="Todo一覧(すべてのメモのチェックリストをまとめて管理)">✓</button>
            <button id="menuBtn" class="icon-btn ghost" aria-label="メニュー" title="メニュー">⋯</button>
            <button id="newNoteBtn" class="icon-btn dark" aria-label="新しいメモを作成" title="新しいメモ">＋</button>
          </div>
        </div>
        <div class="search-box">
          <span class="search-icon">検索</span>
          <input id="searchInput" type="text" placeholder="メモを検索(タグ:仕事 色:あお など)" title="「タグ:仕事」「色:あお」「フォルダ:私用」のように条件を指定できます。組み合わせるとAND検索になります。" />
          <button id="clearSearchBtn" class="icon-btn ghost" style="display:none" aria-label="検索をクリア">×</button>
        </div>

        <div id="menuPanel" class="menu-panel" style="display:none">
          <div id="dataStatusBox" class="data-status-box">
            <div class="data-status-row">
              <span class="data-status-label">最終保存</span>
              <span id="lastSavedText" class="data-status-value">-</span>
            </div>
            <div class="data-status-row">
              <span class="data-status-label">最終自動バックアップ</span>
              <span id="lastAutoBackupText" class="data-status-value">-</span>
            </div>
          </div>
          <div class="menu-divider"></div>
          <button id="manualBackupBtn" class="menu-item">手動バックアップ(コピーを保存)</button>
          <button id="restoreBackupBtn" class="menu-item">バックアップから復元…</button>
          <button id="showTrashBtn" class="menu-item">ゴミ箱を表示</button>
          <button id="showTodoBtn" class="menu-item">Todo一覧を表示</button>
          <div class="menu-divider"></div>
          <button id="selectAllVisibleBtn" class="menu-item">表示中のメモをすべて選択</button>
          <div class="menu-divider"></div>
          <button id="exportAllMarkdownBtn" class="menu-item">すべてMarkdownで書き出し</button>
          <button id="importMarkdownBtn" class="menu-item">Markdownファイルをインポート</button>
          <div class="menu-divider"></div>
          <label class="menu-item menu-item-label">
            文字サイズ
            <input id="fontSizeRange" type="range" min="13" max="24" step="1" />
          </label>
          <div class="menu-divider"></div>
          <button id="showShortcutsBtn" class="menu-item">ショートカットキー一覧</button>
          <button id="showMarkdownGuideBtn" class="menu-item">Markdown記法一覧</button>
          <div class="menu-divider"></div>
          <button id="checkUpdateBtn" class="menu-item">更新を確認…</button>
          <div class="menu-item-version" id="appVersionText"></div>
        </div>

        <div class="folder-row">
          <select id="folderSelect" class="folder-select">
            <option value="">すべてのフォルダ</option>
          </select>
          <button id="newFolderBtn" class="icon-btn square" aria-label="フォルダを追加" title="フォルダを追加">＋</button>
        </div>
        <div class="sort-row">
          <select id="sortSelect" class="folder-select" title="並び替え">
            <option value="updated">更新日順</option>
            <option value="created">作成日順</option>
            <option value="title">タイトル順(五十音)</option>
            <option value="length">文字数順</option>
          </select>
        </div>

        <div id="folderDropRow" class="folder-drop-row"></div>

        <div id="selectionBar" class="selection-bar" style="display:none">
          <span id="selectionCount">0件選択中</span>
          <div class="selection-actions">
            <select id="selectionFolderSelect" class="folder-select small" title="選択したメモをフォルダへ移動">
              <option value="">フォルダへ移動...</option>
            </select>
            <div class="selection-tag-input-wrap">
              <input id="selectionTagInput" class="tag-input small" type="text" placeholder="タグを追加してEnter" autocomplete="off" />
              <div id="selectionTagSuggestions" class="tag-suggestions" style="display:none"></div>
            </div>
            <button id="selectionDeleteBtn" class="btn small danger">ゴミ箱へ</button>
            <button id="selectionSelectAllBtn" class="btn small">すべて選択</button>
            <button id="selectionClearBtn" class="btn small">選択解除</button>
          </div>
        </div>

        <div id="tagFilterRow" class="tag-filter-row"></div>
      </div>

      <div id="noteList" class="note-list"></div>
    </aside>

    <main class="editor">
      <div id="emptyState" class="empty-state">
        <p>メモを選択するか、新しく作成してください。</p>
        <button id="emptyNewNoteBtn" class="btn">＋ 新しいメモ</button>
      </div>

      <div id="trashView" class="editor-view" style="display:none">
        <div class="editor-header">
          <span class="trash-title">ゴミ箱(30日で自動的に完全削除されます)</span>
          <button id="closeTrashBtn" class="icon-btn ghost" aria-label="閉じる">閉じる</button>
        </div>
        <div id="trashList" class="trash-list"></div>
      </div>

      <div id="printPreviewView" class="editor-view" style="display:none">
        <div class="editor-header">
          <span class="trash-title">印刷プレビュー</span>
          <div class="editor-actions">
            <button id="printPreviewGoBtn" class="btn small primary">印刷する</button>
            <button id="closePrintPreviewBtn" class="icon-btn ghost" aria-label="閉じる">閉じる</button>
          </div>
        </div>
        <div class="print-preview-scroll">
          <div id="printPreviewPage" class="print-preview-page"></div>
        </div>
      </div>

      <div id="todoView" class="editor-view todo-view" style="display:none">
        <div class="editor-header">
          <span class="trash-title">Todo一覧(すべてのメモから収集)</span>
          <div class="editor-actions">
            <button id="closeTodoBtn" class="icon-btn ghost" aria-label="閉じる">閉じる</button>
          </div>
        </div>
        <div class="todo-toolbar">
          <input id="todoSearchInput" type="text" class="tag-input" placeholder="Todoを検索" autocomplete="off" />
          <select id="todoGroupBySelect" class="folder-select small" title="グループ分けの方法">
            <option value="note">ノートごとにグループ化</option>
            <option value="folder">フォルダごとにグループ化</option>
            <option value="status">状態(未完了/完了)でグループ化</option>
          </select>
          <label class="todo-hide-done-label">
            <input id="todoHideDoneCheckbox" type="checkbox" />
            完了を隠す
          </label>
          <span id="todoSummary" class="todo-summary"></span>
        </div>
        <div id="todoGroups" class="todo-groups"></div>
      </div>

      <div id="lockView" class="editor-view" style="display:none">
        <div class="lock-box">
          <p id="lockMessage">このメモはロックされています。パスワードを入力してください。</p>
          <input id="lockPasswordInput" type="password" placeholder="パスワード" />
          <div class="lock-actions">
            <button id="lockUnlockBtn" class="btn">開く</button>
          </div>
          <p id="lockError" class="lock-error"></p>
        </div>
      </div>

      <div id="editorView" class="editor-view" style="display:none">
        <div class="editor-header">
          <div class="color-dots" id="colorDots"></div>

          <div class="editor-mid">
            <select id="folderAssignSelect" class="folder-select small" title="フォルダに割り当て">
              <option value="">フォルダなし</option>
            </select>
            <div class="tag-input-wrap">
              <input id="tagInput" class="tag-input" type="text" placeholder="タグを追加してEnter" autocomplete="off" />
              <div id="tagSuggestions" class="tag-suggestions" style="display:none"></div>
            </div>
          </div>

          <div class="editor-actions">
            <span id="saveState" class="save-state">保存済み</span>
            <button id="markdownToggleBtn" class="icon-btn ghost" aria-label="Markdownプレビュー切替" title="Markdownプレビュー切替">MD</button>
            <button id="lockToggleBtn" class="icon-btn ghost" aria-label="パスワードロック" title="パスワードロック">鍵</button>
            <button id="printBtn" class="icon-btn ghost" aria-label="印刷プレビュー" title="印刷プレビュー">印刷</button>
            <div class="export-menu-wrap">
              <button id="exportBtn" class="icon-btn ghost" aria-label="書き出し" title="書き出し">書出</button>
              <div id="exportMenu" class="export-menu" style="display:none">
                <button id="exportTxtBtn" class="menu-item">テキストとして書き出し(.txt)</button>
                <button id="exportPdfBtn" class="menu-item">PDFとして書き出し(.pdf)</button>
              </div>
            </div>
            <button id="pinBtn" class="icon-btn ghost" aria-label="固定する" title="固定する">画鋲</button>
            <button id="deleteBtn" class="icon-btn ghost" aria-label="ゴミ箱に移動" title="ゴミ箱に移動">削除</button>
          </div>
        </div>

        <div id="tagListRow" class="tag-list-row"></div>

        <div id="noteSearchBar" class="note-search-bar" style="display:none">
          <input id="noteSearchInput" class="note-search-input" type="text" placeholder="このメモ内を検索" autocomplete="off" />
          <span id="noteSearchCount" class="note-search-count">0/0</span>
          <button id="noteSearchPrevBtn" class="icon-btn ghost small" aria-label="前へ" title="前へ(Shift+Enter)">↑</button>
          <button id="noteSearchNextBtn" class="icon-btn ghost small" aria-label="次へ" title="次へ(Enter)">↓</button>
          <input id="noteReplaceInput" class="note-search-input note-replace-input" type="text" placeholder="置換後" autocomplete="off" />
          <button id="noteReplaceBtn" class="btn small" type="button">置換</button>
          <button id="noteReplaceAllBtn" class="btn small" type="button">すべて置換</button>
          <button id="noteSearchCloseBtn" class="icon-btn ghost small" aria-label="検索を閉じる" title="閉じる(Esc)">×</button>
        </div>

        <div id="bodyInput" class="body-editable" contenteditable="true" data-placeholder="ここに書き始めてください。最初の行がタイトルになります。"></div>
        <div id="mdPreview" class="md-preview body-editable" contenteditable="true" style="display:none"></div>

        <div class="status-bar">
          <span id="charCount">0文字</span>
          <span id="lineCount">1行</span>
        </div>
      </div>
    </main>
  </div>

  <div id="modalOverlay" class="modal-overlay" style="display:none">
    <div class="modal-box">
      <p id="modalMessage" class="modal-message"></p>
      <input id="modalInput" class="modal-input" type="text" style="display:none" />
      <p id="modalError" class="modal-error"></p>
      <div class="modal-actions">
        <button id="modalCancelBtn" class="btn">キャンセル</button>
        <button id="modalOkBtn" class="btn primary">OK</button>
      </div>
    </div>
  </div>

  <div id="shortcutsOverlay" class="modal-overlay" style="display:none">
    <div class="modal-box shortcuts-box">
      <h2 class="shortcuts-title">ショートカットキー一覧</h2>
      <div id="shortcutsList" class="shortcuts-list"></div>
      <div class="modal-actions">
        <button id="shortcutsCloseBtn" class="btn primary">閉じる</button>
      </div>
    </div>
  </div>

  <div id="markdownGuideOverlay" class="modal-overlay" style="display:none">
    <div class="modal-box shortcuts-box">
      <h2 class="shortcuts-title">Markdown記法一覧</h2>
      <div id="markdownGuideList" class="shortcuts-list"></div>
      <div class="modal-actions">
        <button id="markdownGuideCloseBtn" class="btn primary">閉じる</button>
      </div>
    </div>
  </div>

  <div id="restoreOverlay" class="modal-overlay" style="display:none">
    <div class="modal-box restore-box">
      <p class="modal-message">復元するバックアップを選んでください。現在のメモはすべて置き換えられます(復元前に自動でバックアップを取ります)。</p>
      <div id="restoreList" class="restore-list"></div>
      <div class="modal-actions">
        <button id="restoreFromFileBtn" class="btn">ファイルから選ぶ…</button>
        <button id="restoreCancelBtn" class="btn">閉じる</button>
      </div>
    </div>
  </div>

  <div id="updateBanner" class="update-banner" style="display:none">
    <span id="updateBannerText" class="update-banner-text"></span>
    <div class="update-banner-actions">
      <button id="updateBannerActionBtn" class="btn primary small" style="display:none">今すぐ再起動して更新</button>
      <button id="updateBannerDismissBtn" class="icon-btn ghost small" aria-label="閉じる" title="閉じる">×</button>
    </div>
  </div>

  <script src="js/00-bridge.js"></script>
  <script src="js/01-core-state.js"></script>
  <script src="js/02-dom.js"></script>
  <script src="js/03-notes-data.js"></script>
  <script src="js/04-markdown-render.js"></script>
  <script src="js/05-md-editor.js"></script>
  <script src="js/06-editor.js"></script>
  <script src="js/07-render-ui.js"></script>
  <script src="js/08-modal.js"></script>
  <script src="js/09-body-input.js"></script>
  <script src="js/10-export.js"></script>
  <script src="js/11-backup.js"></script>
  <script src="js/12-note-search.js"></script>
  <script src="js/13-shortcuts.js"></script>
  <script src="js/14-app-init.js"></script>
  <script src="js/15-update-ui.js"></script>
</body>
</html>
