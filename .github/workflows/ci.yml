# 試験とWindows版の試作ビルド。プッシュとプルリクエストごとに動く。
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: 画面側と橋渡し層の試験(node)
        run: npm test
      - name: 旧版(Electron)の試験(固定データの出どころの確認)
        run: npm run test:legacy
      - name: Rust 側の試験(Windows 専用部分を含めてコンパイルされる)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: 導入プログラムの試作(更新用の署名はしない)
        run: npx tauri build --config src-tauri/tauri.ci.conf.json
      - name: 容量の記録
        shell: pwsh
        run: |
          Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
          Get-ChildItem src-tauri/target/release/*.exe | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }
      - uses: actions/upload-artifact@v4
        with:
          name: nsis-installer
          path: src-tauri/target/release/bundle/nsis/*.exe

  linux-e2e:
    # 端から端までの試験(WebKitGTK)。Windows の WebView2 での確認は実機チェックリストで行う。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev webkit2gtk-driver xvfb python3-xlib
          cargo install tauri-driver --locked
      - run: npm ci
      - run: cargo build --locked --manifest-path src-tauri/Cargo.toml
      - run: xvfb-run -a node e2e/run-linux.mjs src-tauri/target/debug/memo-app
